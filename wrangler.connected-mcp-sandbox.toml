# Provision CRM_CONNECTED_SANDBOX_TEST_KEY as a Wrangler secret. Public fixture
# control, seeding, login, approval and diagnostics routes fail closed without it.

[vars]
CRM_CONNECTED_BROWSER_ENABLED = "true"
CRM_CONNECTED_MCP_ENABLED = "true"
CRM_CONNECTED_ENVIRONMENT = "sandbox"
CRM_CONNECTED_MCP_S04_ENABLED = "true"
CRM_CONNECTED_CP_ISSUER = "https://cp.example.invalid"
CRM_CONNECTED_PUBLIC_ORIGIN = "https://crm-web-connected-mcp-sandbox-20261008b.skillset-apply.workers.dev"
CRM_CONNECTED_REDIRECT_URI = "https://crm-web-connected-mcp-sandbox-20261008b.skillset-apply.workers.dev/auth/connected/callback"
CRM_CONNECTED_DEFAULT_CATALOG_PATH = "/catalogs/build-aaaaaaaaaaaaaaaaaaaaaaaa"
CRM_CONNECTED_CP_SERVICE_KEY = "local-test-service-key-12345678901234567890"
CRM_CONNECTED_BFF_ENCRYPTION_KEY = "1111111111111111111111111111111111111111111111111111111111111111"
CRM_CONNECTED_TEST_TELEGRAM_BOT_USERNAME = "flexi_leads_bot"

[[d1_databases]]
